<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Viva Memoria</title>


<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}


body{

    background:

        linear-gradient(
            rgba(239,247,250,.92),
            rgba(239,247,250,.92)
        ),

        url("fondo.jpg");

    background-size:cover;

    background-position:center;

    background-attachment:fixed;

    background-repeat:no-repeat;

    color:#263746;

    min-height:100vh;

}


/* =====================================================
   HEADER
===================================================== */

header{

    background:

        linear-gradient(
            rgba(63,81,181,.90),
            rgba(91,107,192,.90)
        ),

        url("https://cdn.shopify.com/s/files/1/1619/4221/files/21-2.jpg?v=1720112676");

    background-size:cover;

    background-position:center;

    color:white;

    padding:20px;

    display:flex;

    align-items:center;

    gap:15px;

    border-radius:0 0 25px 25px;

    position:sticky;

    top:0;

    z-index:10;

    box-shadow:
        0 4px 15px rgba(45,62,90,.20);

}


/* =====================================================
   LOGO
===================================================== */

.logo{

    width:60px;

    height:60px;

    border-radius:50%;

    background:#ffffff;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:32px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.15);

}


header h1{

    font-size:30px;

    text-shadow:
        2px 2px 5px rgba(0,0,0,.25);

}


header p{

    font-size:14px;

    margin-top:4px;

    text-shadow:
        1px 1px 3px rgba(0,0,0,.20);

}


/* =====================================================
   PERFIL DEL HEADER
===================================================== */

.perfil-header{

    margin-left:auto;

    display:flex;

    align-items:center;

    gap:10px;

    background:rgba(255,255,255,.18);

    padding:8px 12px;

    border-radius:15px;

    cursor:pointer;

}


.perfil-header-icon{

    width:42px;

    height:42px;

    border-radius:50%;

    background:#ffffff;

    color:#6b7fc4;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:24px;

    overflow:hidden;

    flex-shrink:0;

}


.perfil-header-icon img{

    width:100%;

    height:100%;

    object-fit:cover;

}


.perfil-header-nombre{

    font-size:15px;

    font-weight:bold;

    max-width:150px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}


/* =====================================================
   CONTENEDOR
===================================================== */

.container{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:20px;

}


/* =====================================================
   BIENVENIDA
===================================================== */

.welcome{

    background:rgba(255,255,255,.92);

    padding:22px;

    border-radius:20px;

    margin-bottom:20px;

    box-shadow:
        0 3px 12px rgba(65,85,110,.10);

    border-left:6px solid #7b8fd8;

}


.welcome h2{

    margin-bottom:8px;

    color:#40558f;

}


.welcome p{

    color:#526270;

}


/* =====================================================
   MENU PRINCIPAL
===================================================== */

.menu{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;

}


.menu button{

    border:none;

    background:#ffffff;

    color:#40558f;

    border-radius:20px;

    min-height:130px;

    padding:15px;

    font-size:40px;

    cursor:pointer;

    box-shadow:
        0 4px 14px rgba(65,85,110,.12);

    transition:.2s;

    border:2px solid #e1e8f5;

}


.menu button:hover{

    transform:scale(1.02);

    background:#f5f8ff;

    border-color:#9aa9dd;

}


.menu span{

    display:block;

    font-size:17px;

    font-weight:bold;

    margin-top:10px;

    color:#34495e;

}


#contenido{

    margin-top:20px;

}


/* =====================================================
   TARJETAS
===================================================== */

.card{

    background:rgba(255,255,255,.96);

    padding:22px;

    border-radius:20px;

    box-shadow:
        0 4px 14px rgba(65,85,110,.10);

    margin-bottom:15px;

    border:1px solid #e2e9f2;

}


.card h2{

    margin-bottom:15px;

    color:#5369a8;

}


/* =====================================================
   BOTONES
===================================================== */

.btn{

    border:none;

    background:#6685d6;

    color:white;

    padding:13px 18px;

    border-radius:12px;

    font-size:16px;

    cursor:pointer;

    margin:5px 3px;

    box-shadow:
        0 2px 6px rgba(60,80,130,.15);

}


.btn:hover{

    background:#5574c7;

}


.btn-danger{

    background:#d97979;

}


.btn-danger:hover{

    background:#c96666;

}


.btn-green{

    background:#6dbb8a;

}


.btn-green:hover{

    background:#58a976;

}


.btn-gray{

    background:#7b8794;

}


.btn-gray:hover{

    background:#697581;

}


/* =====================================================
   FORMULARIOS
===================================================== */

input,
textarea,
select{

    width:100%;

    padding:13px;

    margin:7px 0 12px;

    border:1px solid #cbd8e6;

    border-radius:10px;

    font-size:16px;

    background:#fbfdff;

    color:#263746;

}


input:focus,
textarea:focus,
select:focus{

    outline:none;

    border-color:#8095d6;

    box-shadow:
        0 0 0 3px rgba(128,149,214,.15);

}


label{

    font-weight:bold;

    color:#405467;

}


.item{

    background:#f4f8fc;

    padding:15px;

    border-radius:14px;

    margin:10px 0;

    border:1px solid #e2eaf2;

}


.item strong{

    display:block;

    font-size:18px;

    margin-bottom:5px;

    color:#40558f;

}


/* =====================================================
   MEMORIA
===================================================== */

.instruccion{

    background:#edf3ff;

    padding:18px;

    border-radius:15px;

    margin:15px 0;

    line-height:1.6;

    color:#405467;

    border-left:5px solid #7b8fd8;

}


.imagenes-memoria{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;

    margin:20px 0;

}


.imagen-memoria{

    background:#e8eefb;

    border:3px solid transparent;

    border-radius:18px;

    min-height:110px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    font-size:45px;

    cursor:pointer;

    transition:.2s;

    color:#405467;

}


.imagen-memoria:hover{

    background:#dfe8fa;

}


.imagen-memoria span{

    font-size:14px;

    font-weight:bold;

    margin-top:5px;

    color:#405467;

}


.imagen-memoria.seleccionada{

    border-color:#6685d6;

    background:#dce6fb;

    transform:scale(1.03);

}


.contador{

    text-align:center;

    font-size:25px;

    font-weight:bold;

    color:#5369a8;

    margin:15px;

}


.resultado{

    text-align:center;

    padding:20px;

    border-radius:18px;

}


.resultado.estable{

    background:#e4f4ea;

}


.resultado.variable{

    background:#f5f0d9;

}


.resultado.bajo{

    background:#f9e4e2;

}


.porcentaje{

    font-size:38px;

    font-weight:bold;

    margin:15px;

    color:#5369a8;

}


/* =====================================================
   PERFIL
===================================================== */

.perfil{

    text-align:center;

}


.perfil label{

    display:block;

    text-align:left;

    margin-top:10px;

}


.perfil small{

    display:block;

    text-align:left;

    color:#687785;

    margin-bottom:10px;

}


.profile-photo{

    width:110px;

    height:110px;

    border-radius:50%;

    background:#e5efff;

    display:flex;

    align-items:center;

    justify-content:center;

    margin:10px auto 20px;

    font-size:55px;

    overflow:hidden;

    border:4px solid #ffffff;

    box-shadow:
        0 3px 10px rgba(0,0,0,.15);

}


.profile-photo img{

    width:100%;

    height:100%;

    object-fit:cover;

}


/* =====================================================
   ALERTA
===================================================== */

.alert{

    padding:15px;

    border-radius:12px;

    background:#eef4ff;

    margin:10px 0;

    border-left:5px solid #7b8fd8;

    color:#405467;

}


/* =====================================================
   NOTIFICACIÓN
===================================================== */

#notificacionViva{

    position:fixed;

    top:20px;

    left:50%;

    transform:translateX(-50%);

    width:calc(100% - 30px);

    max-width:500px;

    background:white;

    border-radius:22px;

    padding:25px;

    text-align:center;

    box-shadow:
        0 8px 30px rgba(45,62,90,.30);

    border:4px solid #6685d6;

    z-index:9999;

    animation:
        entradaNotificacion .3s ease;

}


@keyframes entradaNotificacion{

    from{

        opacity:0;

        transform:
            translateX(-50%)
            translateY(-30px);

    }

    to{

        opacity:1;

        transform:
            translateX(-50%)
            translateY(0);

    }

}


/* =====================================================
   AGENDA
===================================================== */

.agenda-titulo{

    text-align:center;

    font-size:22px;

    margin-bottom:10px;

    color:#5369a8;

}


.agenda-pendiente{

    border-left:6px solid #6685d6;

    background:#f1f5fc;

}


.agenda-realizada{

    border-left:6px solid #6dbb8a;

    background:#eef8f1;

    opacity:.9;

}


/* =====================================================
   PIE DE PÁGINA
===================================================== */

footer{

    text-align:center;

    padding:25px;

    color:#607080;

}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:600px){

    header h1{

        font-size:22px;

    }


    .logo{

        width:55px;

        height:55px;

    }


    .perfil-header{

        padding:6px;

    }


    .perfil-header-nombre{

        display:none;

    }


    .menu{

        grid-template-columns:1fr;

    }


    .menu button{

        min-height:110px;

    }


    .imagenes-memoria{

        grid-template-columns:
            repeat(3,1fr);

    }


    .imagen-memoria{

        min-height:90px;

        font-size:35px;

    }


    #notificacionViva{

        top:10px;

        width:calc(100% - 20px);

        padding:20px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     AUDIO PERSONALIZADO
===================================================== -->

<audio
    id="audioAviso"
    src="recordatorio.mp3"
    preload="auto">
</audio>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        🧠
    </div>


    <div>

        <h1>
            Viva Memoria
        </h1>

        <p>
            Tu memoria, siempre contigo 💙
        </p>

    </div>


    <div
        class="perfil-header"
        onclick="mostrarPerfil()"
        title="Abrir mi perfil">

        <div
            class="perfil-header-icon"
            id="fotoHeader">

            👤

        </div>


        <div
            class="perfil-header-nombre"
            id="nombreHeader">

            Mi perfil

        </div>

    </div>

</header>


<div class="container">


<!-- =====================================================
     BIENVENIDA
===================================================== -->

<div class="welcome">

    <h2 id="saludoUsuario">
        ¡Bienvenido/a! 👋
    </h2>

    <p>
        Selecciona una opción para comenzar.
    </p>

</div>


<!-- =====================================================
     MENU
===================================================== -->

<div class="menu">

    <button onclick="mostrarMemoria()">

        🧠

        <span>
            Ejercicio de memoria
        </span>

    </button>


    <button onclick="mostrarAgenda()">

        📅

        <span>
            Agenda y recordatorios
        </span>

    </button>


    <button onclick="mostrarFamilia()">

        👨‍👩‍👧

        <span>
            Mi familia
        </span>

    </button>


    <button onclick="mostrarPerfil()">

        👤

        <span>
            Mi perfil
        </span>

    </button>


    <button onclick="mostrarSeguridad()">

        🛡️

        <span>
            Seguridad
        </span>

    </button>

</div>


<div id="contenido">

    <div class="card">

        <h2>
            💙 Viva Memoria
        </h2>

        <p>
            Aplicación de apoyo para ejercicios de memoria,
            recordatorios y organización personal.
        </p>

    </div>

</div>

</div>


<footer>

    Viva Memoria © 2026

</footer>


<script>

/* =====================================================
   FUNCIONES GENERALES
===================================================== */

function guardar(nombre,datos){

    localStorage.setItem(
        nombre,
        JSON.stringify(datos)
    );

}


function cargar(nombre,defecto=[]){

    const datos =
        localStorage.getItem(nombre);

    if(datos){

        try{

            return JSON.parse(datos);

        }catch(error){

            return defecto;

        }

    }

    return defecto;

}


/* =====================================================
   ACTUALIZAR PERFIL EN HEADER
===================================================== */

function actualizarPerfilHeader(){

    const perfil =
        cargar("perfil",{

            nombre:"",
            edad:"",
            informacion:"",
            foto:""

        });


    const nombreHeader =
        document.getElementById(
            "nombreHeader"
        );


    const fotoHeader =
        document.getElementById(
            "fotoHeader"
        );


    if(fotoHeader){

        if(perfil.foto){

            fotoHeader.innerHTML=`

                <img
                    src="${perfil.foto}"
                    alt="Foto de perfil">

            `;

        }else{

            fotoHeader.innerHTML="👤";

        }

    }


    const saludo =
        document.getElementById(
            "saludoUsuario"
        );


    if(perfil.nombre){

        nombreHeader.textContent =
            perfil.nombre;

        saludo.innerHTML =
            "¡Bienvenido/a, " +
            perfil.nombre +
            "! 👋";

    }else{

        nombreHeader.textContent =
            "Mi perfil";

        saludo.innerHTML =
            "¡Bienvenido/a! 👋";

    }

}


/* =====================================================
   EJERCICIO DE MEMORIA
===================================================== */

const bancoImagenes=[

    {emoji:"🍎",nombre:"Manzana"},
    {emoji:"🚗",nombre:"Auto"},
    {emoji:"🐶",nombre:"Perro"},
    {emoji:"🌸",nombre:"Flor"},
    {emoji:"🏠",nombre:"Casa"},
    {emoji:"📱",nombre:"Teléfono"},
    {emoji:"🍌",nombre:"Banana"},
    {emoji:"⚽",nombre:"Pelota"},
    {emoji:"🐱",nombre:"Gato"},
    {emoji:"☀️",nombre:"Sol"},
    {emoji:"🚲",nombre:"Bicicleta"},
    {emoji:"🍓",nombre:"Frutilla"},
    {emoji:"🐟",nombre:"Pez"},
    {emoji:"🌳",nombre:"Árbol"},
    {emoji:"🎸",nombre:"Guitarra"},
    {emoji:"☕",nombre:"Taza"}

];


let imagenesParaRecordar=[];

let opcionesRecuerdo=[];

let tiempoObservacion=10;

let temporizador=null;


/* =====================================================
   MOSTRAR MEMORIA
===================================================== */

function mostrarMemoria(){

    document.getElementById("contenido").innerHTML=`

    <div class="card">

        <h2>
            🧠 Ejercicio de memoria
        </h2>


        <div class="instruccion">

            <strong>
                ¿Cómo funciona?
            </strong>

            <p>

                Primero observarás algunas imágenes.
                Trata de recordar cuáles aparecen.
                Después desaparecerán y tendrás que
                seleccionar las 3 que recuerdes.

            </p>

        </div>


        <button
            class="btn"
            onclick="comenzarEjercicio()">

            ▶️ Comenzar ejercicio

        </button>


        <br><br>


        <button
            class="btn"
            onclick="mostrarHistorialMemoria()">

            📊 Ver historial

        </button>


        <div id="memoriaArea"></div>

    </div>

    `;

}


/* =====================================================
   COMENZAR EJERCICIO
===================================================== */

function comenzarEjercicio(){

    tiempoObservacion=10;


    imagenesParaRecordar =
        [...bancoImagenes]
        .sort(()=>Math.random()-0.5)
        .slice(0,3);


    const otras =
        bancoImagenes
        .filter(img =>
            !imagenesParaRecordar.includes(img)
        )
        .sort(()=>Math.random()-0.5)
        .slice(0,3);


    opcionesRecuerdo=[

        ...imagenesParaRecordar,

        ...otras

    ].sort(()=>Math.random()-0.5);


    mostrarImagenesObservacion();

}


/* =====================================================
   FASE 1
===================================================== */

function mostrarImagenesObservacion(){

    const area =
        document.getElementById(
            "memoriaArea"
        );


    let html=`

        <div class="contador">

            ⏱️

            <span id="tiempo">
                ${tiempoObservacion}
            </span>

            segundos

        </div>


        <div class="instruccion">

            👀

            <strong>
                Observa y recuerda.
            </strong>

            <br>

            Trata de recordar las 3 imágenes.

        </div>


        <div class="imagenes-memoria">

    `;


    imagenesParaRecordar.forEach(img=>{

        html+=`

            <div class="imagen-memoria">

                <div>
                    ${img.emoji}
                </div>

                <span>
                    ${img.nombre}
                </span>

            </div>

        `;

    });


    html+=`</div>`;


    area.innerHTML=html;


    temporizador=setInterval(()=>{

        tiempoObservacion--;


        const contador =
            document.getElementById(
                "tiempo"
            );


        if(contador){

            contador.textContent =
                tiempoObservacion;

        }


        if(tiempoObservacion<=0){

            clearInterval(
                temporizador
            );

            mostrarRecuerdo();

        }

    },1000);

}


/* =====================================================
   FASE 2
===================================================== */

function mostrarRecuerdo(){

    const area =
        document.getElementById(
            "memoriaArea"
        );


    let html=`

        <div class="instruccion">

            🧠

            <strong>
                Ahora recuerda.
            </strong>

            <br>

            Selecciona solamente las imágenes
            que viste anteriormente.

        </div>


        <div class="imagenes-memoria">

    `;


    opcionesRecuerdo.forEach((img,index)=>{

        html+=`

            <button
                class="imagen-memoria"
                id="recuerdo-${index}"
                onclick="seleccionarImagen(${index})">

                <div>
                    ${img.emoji}
                </div>

                <span>
                    ${img.nombre}
                </span>

            </button>

        `;

    });


    html+=`

        </div>


        <button
            class="btn btn-green"
            onclick="comprobarMemoria()">

            ✅ Comprobar respuestas

        </button>

    `;


    area.innerHTML=html;

}


/* =====================================================
   SELECCIONAR IMAGEN
===================================================== */

function seleccionarImagen(index){

    const boton =
        document.getElementById(
            "recuerdo-"+index
        );


    boton.classList.toggle(
        "seleccionada"
    );

}


/* =====================================================
   COMPROBAR MEMORIA
===================================================== */

function comprobarMemoria(){

    const botones =
        document.querySelectorAll(
            ".imagen-memoria.seleccionada"
        );


    let seleccionadas=[];


    botones.forEach(boton=>{

        const index =
            parseInt(
                boton.id.replace(
                    "recuerdo-",""
                )
            );


        seleccionadas.push(
            opcionesRecuerdo[index]
        );

    });


    let aciertos=0;


    seleccionadas.forEach(img=>{

        if(
            imagenesParaRecordar.includes(img)
        ){

            aciertos++;

        }

    });


    const errores =
        seleccionadas.filter(
            img =>
                !imagenesParaRecordar.includes(img)
        ).length;


    const olvidadas =
        imagenesParaRecordar.filter(
            img =>
                !seleccionadas.includes(img)
        ).length;


    const porcentaje =
        Math.round(
            (
                aciertos /
                imagenesParaRecordar.length
            ) * 100
        );


    guardarResultado(
        aciertos,
        errores,
        olvidadas,
        porcentaje
    );

}


/* =====================================================
   GUARDAR RESULTADO
===================================================== */

function guardarResultado(
    aciertos,
    errores,
    olvidadas,
    porcentaje
){

    const historial =
        cargar(
            "historialMemoria",
            []
        );


    const resultado={

        fecha:
            new Date().toLocaleString(),

        aciertos:
            aciertos,

        errores:
            errores,

        olvidadas:
            olvidadas,

        porcentaje:
            porcentaje

    };


    historial.push(
        resultado
    );


    guardar(
        "historialMemoria",
        historial
    );


    mostrarResultado(
        resultado
    );

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(resultado){

    let clasificacion="estable";

    let titulo="🟢 Buen rendimiento";

    let mensaje =
        "¡Muy bien! Continúa ejercitando tu memoria.";


    if(resultado.porcentaje<50){

        clasificacion="bajo";

        titulo =
            "🟡 Puedes seguir practicando";

        mensaje =
            "No te preocupes. Puedes intentarlo nuevamente.";

    }

    else if(resultado.porcentaje<75){

        clasificacion="variable";

        titulo =
            "🟢 Buen esfuerzo";

        mensaje =
            "Continúa practicando para fortalecer tu memoria.";

    }


    document.getElementById(
        "memoriaArea"
    ).innerHTML=`

        <div
            class="resultado ${clasificacion}">

            <h2>
                ${titulo}

let ultimoAviso = "";

/* =====================================================
   ACTIVAR AUDIO
===================================================== */

function activarAudio(){

    audioActivado = true;


    const audio =
        document.getElementById(
            "audioAviso"
        );


    if(audio){

        audio.muted = true;


        audio.play()

        .then(()=>{

            audio.pause();

            audio.currentTime=0;

            audio.muted=false;

        })

        .catch(error=>{

            console.log(
                "El navegador todavía no permite activar el audio:",
                error
            );

        });

    }

}


/* =====================================================
   REPRODUCIR AUDIO PERSONALIZADO
===================================================== */

function reproducirAviso(){

    const audio =
        document.getElementById(
            "audioAviso"
        );


    if(!audio){

        console.log(
            "No se encontró el audio."
        );

        return;

    }


    audio.currentTime=0;

    audio.muted=false;


    audio.play()

    .then(()=>{

        console.log(
            "Audio del recordatorio reproducido."
        );


        setTimeout(()=>{

            audio.pause();

            audio.currentTime=0;

        },5000);

    })

    .catch(error=>{

        console.log(
            "No se pudo reproducir el audio:",
            error
        );

    });

}

/* =====================================================
   FORMATEAR FECHA
===================================================== */

function formatearFecha(fecha){

    const partes =
        fecha.split("-");


    if(partes.length!==3){

        return fecha;

    }


    return partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0];

}


/* =====================================================
   AGREGAR AGENDA
===================================================== */

function agregarAgenda(){

    activarAudio();


    const fecha =
        document.getElementById(
            "agendaFecha"
        ).value;


    const hora =
        document.getElementById(
            "agendaHora"
        ).value;


    const actividad =
        document.getElementById(
            "agendaActividad"
        ).value.trim();


    if(!fecha || !hora || !actividad){

        alert(
            "Completa la fecha, la hora y la actividad."
        );

        return;

    }


    const agenda =
        cargar(
            "agenda",
            []
        );


    agenda.push({

        fecha:fecha,

        hora:hora,

        actividad:actividad,

        realizada:false,

        ultimoAviso:""

    });


    guardar(
        "agenda",
        agenda
    );


    alert(
        "✅ Recordatorio guardado correctamente."
    );


    mostrarAgenda();

}


/* =====================================================
   CAMBIAR ESTADO
===================================================== */

function cambiarEstadoAgenda(index){

    const agenda =
        cargar(
            "agenda",
            []
        );

        return;

    }


    agenda[index].realizada =
        !agenda[index].realizada;


    guardar(
        "agenda",
        agenda
    );


    mostrarAgenda();

}


/* =====================================================
   ELIMINAR ACTIVIDAD
===================================================== */

function eliminarAgenda(index){

    const agenda =
        cargar(

            []

    if(!agenda[index]){

        return;

    if(confirm(

    )){

        agenda.splice(
            index,
            1
        );


        guardar(
            "agenda",
            agenda
        );


        mostrarAgenda();

    }

}

/* =====================================================

===================================================== */

function revisarAgenda(){

    const ahora = new Date();

    const fechaActual =
        ahora.getFullYear() +
        "-" +
        String(ahora.getMonth()+1).padStart(2,"0") +
        "-" +
        String(ahora.getDate()).padStart(2,"0");

    const horaActual =
        String(ahora.getHours()).padStart(2,"0") +
        ":" +
        String(ahora.getMinutes()).padStart(2,"0");

    const agenda = cargar("agenda", []);

    let cambios = false;

    agenda.forEach(actividad => {

        if(
            actividad.fecha === fechaActual &&
            actividad.hora === horaActual &&
            actividad.realizada !== true &&
            actividad.ultimoAviso !== fechaActual + "-" + horaActual
        ){

            actividad.ultimoAviso =
                fechaActual + "-" + horaActual;

            cambios = true;

            mostrarNotificacion(

                "¡Tienes un recordatorio! 🔔",

                "Es hora de: " +
                "<strong>" +
                actividad.actividad +
                "</strong>"

            );

        }

    });

    if(cambios){

        guardar("agenda", agenda);

    }

}

function previsualizarFoto(event){

    const archivo =
        event.target.files[0];


    if(!archivo){

        return;

    }


    if(
        !archivo.type.startsWith(
            "image/"
        )
    ){

        alert(
            "Selecciona una imagen válida."
        );

        return;

    }


    const lector =
        new FileReader();


    lector.onload=function(e){

        window.fotoPerfilActual =
            e.target.result;


        const preview =
            document.getElementById(
                "perfilFotoPreview"
            );


        if(preview){

            preview.innerHTML=`

                <img
                    src="${e.target.result}"
                    alt="Foto de perfil">

            `;

        }

    };


    lector.readAsDataURL(
        archivo
    );

}
